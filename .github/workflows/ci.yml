name: CI

on:
  push:
    branches: 
      - main 
      - ci_test
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: true

    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y curl gnupg tar

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: 'sbt'

    - name: Install sbt
      run: |
        curl -sL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x2EE0EA64E40A89B84B2DF73499E82A75642AC823" | sudo gpg --dearmor -o /usr/share/keyrings/sbt.gpg
        echo "deb [signed-by=/usr/share/keyrings/sbt.gpg] https://repo.scala-sbt.org/scalasbt/debian all main" | sudo tee /etc/apt/sources.list.d/sbt.list
        sudo apt-get update
        sudo apt-get install -y sbt

    - name: Cache SBT
      uses: actions/cache@v3
      with:
        path: |
          ~/.sbt
          ~/.ivy2/cache
          ~/.coursier/cache/v1
        key: ${{ runner.os }}-sbt-${{ hashFiles('**/*.sbt') }}-${{ hashFiles('project/build.properties') }}

    - name: Cache Isabelle
      id: isabelle-cache
      uses: actions/cache@v3
      with:
        path: Isabelle2024
        key: isabelle-2024-${{ runner.os }}-${{ hashFiles('**/Isabelle2024_linux.tar.gz') }}

    - name: Install Isabelle
      if: steps.isabelle-cache.outputs.cache-hit != 'true'
      run: |
        wget https://isabelle.in.tum.de/website-Isabelle2024/dist/Isabelle2024_linux.tar.gz
        tar -xzf Isabelle2024_linux.tar.gz
        chmod -R +x Isabelle2024/bin

    - name: Verify Isabelle Installation
      run: |
        if [ ! -d "Isabelle2024" ]; then
          echo "Error: Isabelle2024 directory not found!"
          exit 1
        fi
        if [ ! -f "Isabelle2024/bin/isabelle" ]; then
          echo "Error: isabelle executable not found!"
          exit 1
        fi
        if [ ! -x "Isabelle2024/bin/isabelle" ]; then
          echo "Error: isabelle executable is not executable!"
          exit 1
        fi
        echo "ISABELLE_HOME=$PWD/Isabelle2024" >> $GITHUB_ENV
        echo "$PWD/Isabelle2024/bin" >> $GITHUB_PATH

    - name: Verify Isabelle Environment
      run: |
        echo "ISABELLE_HOME: $ISABELLE_HOME"
        echo "PATH: $PATH"
        which isabelle
        isabelle version

    - name: Build and Test
      run: |
        sbt "testOnly RunIsar.ReplTests"

    - name: Install Python dependencies
      run: |
        pip install pytest
        pip install py4j

    - name: Build JAR
      run: |
        sbt assembly
        JAR_PATH=$(find target -name "IsaREPL.jar" | head -n 1)
        if [ -z "$JAR_PATH" ]; then
          echo "Error: JAR file not found!"
          exit 1
        fi
        echo "JAR_PATH=$PWD/$JAR_PATH" >> $GITHUB_ENV

    - name: Run Python Tests
      run: |
        echo "ISA_REPL_PATH: $JAR_PATH"
        python -m pytest python-test/test_repl.py
